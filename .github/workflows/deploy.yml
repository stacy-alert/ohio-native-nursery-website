name: Deploy to Bluehost

# Runs on GitHub's own servers (not sandboxed the way local dev sessions are),
# so it can reach Bluehost directly. Every push to main uploads the site
# files automatically — no manual File Manager/ZIP step needed.
#
# Uses FTPS (encrypted FTP, port 21) rather than SFTP — Bluehost FTP
# sub-accounts like "deploy@domain.com" are virtual FTP users, not real
# SSH/SFTP-capable system users, so SFTP auth fails against them even with
# a correct password. FTP/FTPS is what these accounts are actually for.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Upload site files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_SFTP_HOST }}
          username: ${{ secrets.BLUEHOST_SFTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          # This FTP account's home directory IS public_html (Bluehost
          # chroots it there), so the FTP root "./" already means
          # public_html — do not use the absolute server path here.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            DEPLOY.md
            INVENTORY_SETUP.md
            inventory-seed.csv
