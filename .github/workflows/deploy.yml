name: Deploy to Bluehost

# Runs on GitHub's own servers (not sandboxed the way local dev sessions are),
# so it can reach Bluehost directly. Every push to main uploads the site
# files automatically — no manual File Manager/ZIP step needed.
#
# Uses FTPS (encrypted FTP, port 21) rather than SFTP — Bluehost FTP
# sub-accounts like "deploy@domain.com" are virtual FTP users, not real
# SSH/SFTP-capable system users, so SFTP auth fails against them even with
# a correct password. FTP/FTPS is what these accounts are actually for.
#
# Uploads with plain lftp "mirror --ignore-time" instead of a third-party
# GitHub Action: a prior attempt (SamKirkland/FTP-Deploy-Action) reported
# "success" twice in a row but silently failed to upload some changed
# files (its incremental diff against a remote state file apparently
# missed them). lftp here does no diffing at all — every run re-uploads
# every file unconditionally, so there's no "did it actually detect the
# change" question to get wrong. --verbose prints every single file
# transferred, right in the Actions log, so any future "it didn't update"
# report can be checked against that log instead of guessed at.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Stage deployable files only
        # Only real site files go to the web root — keeps README/DEPLOY
        # docs, .github, and the inventory seed CSV out of public_html.
        # wp-content/uploads (the real photos) already lives on the server
        # and isn't part of this repo, so it's never touched by this step.
        run: |
          mkdir deploy_root
          cp -r index.html about services contact resources css js contact.php robots.txt sitemap.xml deploy_root/
          echo "Files staged for upload:"
          find deploy_root -type f | sort

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Upload every file over FTPS (no incremental diff, no skipped files)
        env:
          FTP_HOST: ${{ secrets.BLUEHOST_SFTP_HOST }}
          FTP_USER: ${{ secrets.BLUEHOST_SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.BLUEHOST_SFTP_PASSWORD }}
        run: |
          # Written as a script file (not inline -e) and connects via an
          # explicit "open" command AFTER the ssl/passive settings are
          # applied. Passing the host as a trailing CLI argument instead
          # triggers an *implicit* connect before any -e settings take
          # effect, which is what caused the previous "mirror: Not
          # connected" failure — it tried plain FTP before ssl-force was
          # ever set. cmd:fail-exit makes any real connect/auth error abort
          # with its actual message instead of cascading into a vague one.
          printf '%s\n' \
            'set ftp:ssl-force true' \
            'set ssl:verify-certificate no' \
            'set ftp:passive-mode true' \
            'set cmd:fail-exit true' \
            "open -u \"$FTP_USER,$FTP_PASS\" \"ftp://$FTP_HOST\"" \
            'lcd deploy_root' \
            'mirror -R --verbose=3 --ignore-time --parallel=2 . .' \
            'bye' \
            > deploy.lftp
          cat deploy.lftp | sed 's/open -u.*/open -u "***"/'
          lftp -f deploy.lftp

      - name: Verify the live domain actually serves this deploy
        # Runs from GitHub's own network — nothing here routes through
        # anyone's home router/ISP, so this is a true "what does the
        # server actually have" check, independent of any client-side or
        # network-level caching a visitor might be hitting. If this step
        # fails, the problem is genuinely server-side; if it passes, any
        # "still looks old" report is downstream caching, not a bad
        # deploy — and this run's own log is the record of that.
        run: |
          sleep 5
          css=$(curl -sf --max-time 20 "https://ohionativenursery.com/css/styles.css?check=$GITHUB_RUN_ID")
          echo "----- fetched live styles.css (first 20 lines) -----"
          echo "$css" | head -20
          echo "-----------------------------------------------------"
          if echo "$css" | grep -q "rust-dark"; then
            echo "CONFIRMED: live domain is serving the current design."
          else
            echo "::error::Live domain's CSS does NOT contain the new design tokens — the deploy did not actually reach ohionativenursery.com."
            exit 1
          fi
